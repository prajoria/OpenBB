name: Portfolio MCP Coverage Drift

on:
  pull_request:
    branches:
      - portfolio
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".github/workflows/portfolio-mcp-coverage.yml"
      - "openbb_platform/**"
      - "scripts/audit_mcp_capabilities.py"
      - "scripts/test_portfolio_mcp.ps1"
      - "scripts/tests/Test-PortfolioMcp.Tests.ps1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reject-unsupported-interpreter:
    name: Reject unsupported Python 3.14
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up unsupported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Require explicit version diagnostic
        shell: pwsh
        run: |
          try {
            ./scripts/test_portfolio_mcp.ps1 `
              -Profile portfolio-read `
              -Mode package `
              -PythonExecutable (Get-Command python).Source `
              -RepositoryRoot $env:GITHUB_WORKSPACE
            throw "Unsupported interpreter replay unexpectedly succeeded."
          } catch {
            $output = $_ | Out-String
          }
          if ($output -notmatch "Unsupported Python 3.14" -or
              $output -notmatch ">=3.10,<3.14") {
            throw "Unsupported interpreter diagnostic was not explicit: $output"
          }

  replay-portfolio-profile:
    name: Replay Portfolio MCP (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out exact head source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create clean Portfolio environment
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/portfolio-wheels"
          mkdir -p "$wheelhouse"
          python -m pip wheel --no-deps --wheel-dir "$wheelhouse" \
            openbb_platform/core \
            openbb_platform/extensions/platform_api \
            openbb_platform/extensions/mcp_server \
            openbb_platform/extensions/equity \
            openbb_platform/extensions/portfolio \
            openbb_platform/extensions/portfolio_intel \
            openbb_platform/extensions/techtrade \
            openbb_platform/extensions/backtest \
            openbb_platform/extensions/regime \
            openbb_platform/providers/fmp \
            openbb_platform/providers/fmp_cached \
            openbb_platform/providers/yfinance
          python -m venv "$RUNNER_TEMP/portfolio-replay"
          replay="$RUNNER_TEMP/portfolio-replay/bin/python"
          "$replay" -m pip install --upgrade pip
          mapfile -t regular_wheels < <(
            find "$wheelhouse" -maxdepth 1 -name '*.whl' \
              ! -name 'openbb_portfolio_intel-*' \
              ! -name 'openbb_techtrade-*' -print
          )
          "$replay" -m pip install "${regular_wheels[@]}"
          "$replay" -m pip install --no-deps \
            "$wheelhouse"/openbb_techtrade-*.whl
          "$replay" -m pip install --no-deps \
            "$wheelhouse"/openbb_portfolio_intel-*.whl
          "$replay" -m pip install openpyxl pandas-ta-classic
          "$replay" -m pip check
          "$replay" -m pip install pytest pytest-asyncio pytest-mock
          "$replay" -c "import openbb; openbb.build()"

      - name: Verify required manifest sources and packaged assets
        shell: pwsh
        run: |
          ./scripts/test_portfolio_mcp.ps1 `
            -Profile portfolio-read `
            -Mode package `
            -PythonExecutable "$env:RUNNER_TEMP/portfolio-replay/bin/python" `
            -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Verify optional package absence
        shell: bash
        run: |
          "$RUNNER_TEMP/portfolio-replay/bin/python" - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("openbb_financialtoolkit") is None
          PY

      - name: Replay installed HTTP protocol
        shell: bash
        env:
          OPENBB_MCP_RUNTIME_PROFILE: portfolio-read
          OPENBB_MCP_CAPABILITY_PROFILE: portfolio-read
          OPENBB_MCP_INSTALLATION_KIND: portfolio_venv
          OPENBB_MCP_APP_TARGET: openbb_platform/extensions/portfolio/launch.py
          OPENBB_MCP_ENABLE_TOOL_DISCOVERY: "true"
          OPENBB_MCP_ENABLE_INTELLIGENCE_ADAPTER: "true"
          OPENBB_MCP_SERVER_AUTH: '["replay-user","xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"]'
          PI_WIDGET_BACKEND_TOKEN: runtime-replay-token
        run: |
          set -euo pipefail
          replay_root="$RUNNER_TEMP/portfolio-replay"
          "$replay_root/bin/openbb-mcp" \
            --app openbb_platform/extensions/portfolio/launch.py \
            --host 127.0.0.1 \
            --port 8001 \
            --transport streamable-http \
            --tool-discovery \
            >"$RUNNER_TEMP/openbb-mcp.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --output /dev/null \
              http://127.0.0.1:8001/mcp; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/openbb-mcp.log"
              exit 1
            fi
            sleep 1
          done
          authorization="Bearer $(printf '%s' \
            'replay-user:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' | base64 -w0)"
          pwsh -NoProfile -File ./scripts/test_portfolio_mcp.ps1 \
            -Profile portfolio-read \
            -Mode protocol \
            -Uri http://127.0.0.1:8001/mcp \
            -Authorization "$authorization" \
            -TimeoutSeconds 60

      - name: Replay real profile protocol
        shell: bash
        run: |
          "$RUNNER_TEMP/portfolio-replay/bin/python" -m pytest \
            openbb_platform/extensions/mcp_server/tests/integration/test_profile_protocol.py \
            openbb_platform/extensions/mcp_server/tests/service/test_runtime_profiles.py \
            -q

      - name: Verify optional FinancialToolkit installation
        shell: bash
        run: |
          replay="$RUNNER_TEMP/portfolio-replay/bin/python"
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/portfolio-wheels" \
            openbb_platform/extensions/financialtoolkit
          "$replay" -m pip install \
            "$RUNNER_TEMP"/portfolio-wheels/openbb_financialtoolkit-*.whl
          "$replay" -c "import openbb; openbb.build()"
          pwsh ./scripts/test_portfolio_mcp.ps1 \
            -Profile portfolio-read \
            -Mode package \
            -PythonExecutable "$replay" \
            -RepositoryRoot "$GITHUB_WORKSPACE" \
            -OptionalAnalytics openbb-financialtoolkit
          "$replay" -m pytest \
            openbb_platform/extensions/mcp_server/tests/app/test_analytics_profiles.py \
            -q

  compare-portfolio-inventories:
    name: Compare Portfolio MCP inventories
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Require Portfolio integration base
        run: |
          if [[ "$BASE_REF" != "portfolio" ]]; then
            echo "::error title=Wrong MCP coverage base::Expected portfolio, got $BASE_REF"
            exit 1
          fi

      - name: Check out exact base source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0

      - name: Check out exact head source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create isolated metadata environments
        shell: bash
        run: |
          set -euo pipefail
          for source in base head; do
            environment="$RUNNER_TEMP/$source-venv"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install --upgrade pip
            "$environment/bin/python" -m pip install \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/core" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/platform_api" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/mcp_server" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/equity" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/portfolio" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/backtest" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/regime" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/financialtoolkit" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/agents" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/providers/fmp" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/providers/fmp_cached" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/providers/yfinance" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/providers/congress_gov" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/providers/government_us" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/providers/sec" \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/tools/portfolio_utils"
            "$environment/bin/python" \
              "$GITHUB_WORKSPACE/$source/scripts/pi_install.py"
            "$environment/bin/python" -m pip install \
              -e "$GITHUB_WORKSPACE/$source/openbb_platform/extensions/fmp_trading[agent]"
            "$environment/bin/python" -m pip install \
              pytest pytest-asyncio pytest-mock
            "$environment/bin/python" -c \
              "import openbb; openbb.build()"
          done

      - name: Verify head evidence
        shell: bash
        run: |
          set -euo pipefail
          test_roots=(
            "openbb_platform/extensions/mcp_server/tests/service/test_coverage_diff.py"
            "openbb_platform/extensions/mcp_server/tests/app/test_prompt_dependencies.py"
          )
          while IFS= read -r evidence; do
            test_roots+=("$evidence")
          done < <(
            "$RUNNER_TEMP/head-venv/bin/python" -c '
          import json
          from pathlib import Path
          root = Path("head")
          policy = json.loads(
              (root / "openbb_platform/extensions/mcp_server/"
               "openbb_mcp_server/assets/capability_policy.json").read_text()
          )
          for family in policy["traceability"]["work_families"].values():
              for evidence in family["source_evidence"]:
                  is_test = (
                      "/tests/" in f"/{evidence}"
                      or evidence.startswith("tests/")
                      or evidence.endswith("/tests")
                  )
                  if not is_test:
                      continue
                  source = root / evidence
                  files = [source] if source.is_file() else (
                      sorted(source.rglob("*")) if source.is_dir() else []
                  )
                  for path in files:
                      if not path.is_file():
                          continue
                      relative = path.relative_to(root).as_posix()
                      collectable = (
                          path.suffix == ".py"
                          and (
                              path.name.startswith("test_")
                              or path.name.endswith("_test.py")
                          )
                      )
                      if collectable and (
                          "/tests/" in f"/{relative}"
                          or relative.startswith("tests/")
                      ):
                          print(relative)
          '
          )
          mapfile -t unique_tests < <(
            printf '%s\n' "${test_roots[@]}" | sort -u
          )
          pytest_args=()
          for test_root in "${unique_tests[@]}"; do
            pytest_args+=("$GITHUB_WORKSPACE/head/$test_root")
          done
          "$RUNNER_TEMP/head-venv/bin/python" -m pytest \
            "${pytest_args[@]}" -q

      - name: Export exact base inventories
        shell: bash
        run: |
          set -euo pipefail
          for profile in portfolio-read portfolio-ops; do
            "$RUNNER_TEMP/base-venv/bin/python" \
              "$GITHUB_WORKSPACE/base/scripts/audit_mcp_capabilities.py" \
              --profile "$profile" \
              --output-dir "$RUNNER_TEMP/base-inventories/$profile" \
              --metadata-only
          done

      - name: Export and compare exact head inventories
        shell: bash
        run: |
          set -euo pipefail
          for profile in portfolio-read portfolio-ops; do
            "$RUNNER_TEMP/head-venv/bin/python" \
              "$GITHUB_WORKSPACE/head/scripts/audit_mcp_capabilities.py" \
              --profile "$profile" \
              --output-dir "$RUNNER_TEMP/head-inventories/$profile" \
              --metadata-only \
              --comparison-sha "$BASE_SHA" \
              --base-ref "$BASE_REF" \
              --require-lineage \
              --comparison-inventory \
                "$RUNNER_TEMP/base-inventories/$profile/inventory.json" \
              --comparison-repository "$GITHUB_WORKSPACE/base" \
              --tests-verified
          done

      - name: Publish sanitized base inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-mcp-base-inventory
          path: ${{ runner.temp }}/base-inventories
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized head inventory and drift report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-mcp-head-inventory
          path: ${{ runner.temp }}/head-inventories
          if-no-files-found: error
          retention-days: 14
