name: PI Desktop Frontend (lint + typecheck + vitest)

# Fast frontend CI for portfolio-intel desktop widget code.
# Runs on portfolio-targeted PRs that touch desktop/ paths — separate
# from the existing per-OS desktop test workflows which only target
# develop. Filed as #983.

on:
  pull_request:
    branches:
      - portfolio
    paths:
      - 'desktop/**'
      - '.github/workflows/pi-desktop-frontend.yml'
  push:
    branches:
      - portfolio
    paths:
      - 'desktop/**'

concurrency:
  group: pi-desktop-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-desktop-frontend:
    name: PI Desktop Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Regenerate route tree
        # Router codegen writes routeTree.gen.ts; if a PR added a route
        # but didn't regen, typecheck would fail on stale generated
        # types. Regen here so CI matches local dev behavior.
        run: npx @tanstack/router-cli generate

      - name: Verify route tree is up to date
        # After regen the file should match what the PR committed;
        # divergence means the PR author forgot to run codegen.
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::routeTree.gen.ts is out of date. Run 'npx @tanstack/router-cli generate' and commit the result."
            git --no-pager diff src/routeTree.gen.ts | head -100
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run
