[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-snapshot-importer"
version = "0.1.0"
description = "Read-only ingest of dated broker CSVs into an append-only SQLite history store"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenBB Portfolio-Intel"}]
dependencies = []

[project.scripts]
portfolio-snapshot-import = "portfolio_snapshot_importer.cli:main"

[tool.setuptools.packages.find]
include = ["portfolio_snapshot_importer*"]
