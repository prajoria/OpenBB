[project]
name = "openbb_browser_test_harness"
version = "0.1.0"
description = "Dual-mode browser test harness for the OpenBB Portfolio Intelligence Terminal and Techtrade Trading-Desk (EPIC #1721)."
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
workspace = [
    "playwright>=1.45",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[project.scripts]
openbb-browser-harness = "openbb_browser_test_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbb_browser_test_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
