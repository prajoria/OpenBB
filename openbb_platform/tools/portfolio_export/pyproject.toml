[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-export"
version = "0.1.0"
description = "Record and strictly replay Fidelity (and similar broker) sessions with Playwright. Downloads are forced OUTSIDE the source repo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prajoria" }]

dependencies = [
    "playwright>=1.44",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
loaders = [
    "pandas>=2.0",
]

[project.scripts]
portfolio-export = "portfolio_export.cli:main"
pe = "portfolio_export.cli:main"
pe-testdata = "portfolio_export.test_data_generator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portfolio_export*"]
exclude = ["recordings*", "tests*"]
