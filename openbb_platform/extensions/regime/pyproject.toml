[tool.poetry]
name = "openbb-regime"
version = "0.1.0"
description = "Shared market-regime detector for OpenBB (Analysis + techtrade consumers)"
authors = ["Prashant Rajoria"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_regime" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
openbb-core = "^1.6.10"
pandas = "*"
numpy = "*"

[tool.poetry.plugins."openbb_core_extension"]
regime = "openbb_regime.regime_router:router"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
