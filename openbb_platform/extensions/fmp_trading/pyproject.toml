[tool.poetry]
name = "openbb-fmp-trading"
version = "0.1.0"
description = "Intraday day-trading automation extension for OpenBB (fmp_cached)."
authors = ["Trading Automation working group"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_fmp_trading" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
openbb-core = "^1.6.10"
# openbb_core_journal ships as part of openbb-core's distribution (in-tree
# sibling package under openbb_platform/core/openbb_core_journal/). No
# separate dep required; core's pyproject.toml packages list re-exports it.
openbb-techtrade = "^0.1.0"
pandas = "*"
numpy = "*"
exchange-calendars = "*"
pydantic = "^2.0"
# --- [agent] extra deps (Phase 3 / D1 / D2) ---
# Pinned to >=0.40,<1.0 to guard against major SDK breakage mid-Phase-3
# (the ClaudeAgentBackend forced-tool-choice semantics depend on the
# messages.create tool_choice contract stable since 0.40).
anthropic = { version = ">=0.40,<1.0", optional = true }
mcp = { version = ">=1.0", optional = true }
jinja2 = { version = ">=3.1", optional = true }

[tool.poetry.extras]
# agent      -> optional LLM backends for pre/post-close turns + stdio MCP server (P3)
# xlsxwriter -> richer Excel engine, shared with techtrade[xlsxwriter] (P5)
# validation -> backtest bridge (P6)
agent = ["anthropic", "mcp", "jinja2"]

[tool.poetry.scripts]
openbb-daytrade = "openbb_fmp_trading.cli.main:main"

[tool.poetry.plugins."openbb_core_extension"]
fmp_trading = "openbb_fmp_trading.fmp_trading_router:router"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
