<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Workspace Viewer</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;
      --green: #3fb950; --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .badge {
      font-size: 11px; color: var(--muted); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 10px;
    }
    header .spacer { flex: 1; }
    button, select, input {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 9px; font-size: 13px;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .main { flex: 1; display: flex; min-height: 0; }
    .dashboard { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .widget {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .widget > .whead {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-bottom: 1px solid var(--border); background: var(--panel2); flex-wrap: wrap;
    }
    .widget > .whead .wname { font-weight: 600; }
    .widget > .whead .params { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .widget > .whead label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    .wbody { padding: 0; max-height: 460px; overflow: auto; }
    .state { padding: 16px; color: var(--muted); font-size: 13px; }
    .state.err { color: var(--red); }
    table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    th, td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-weight: 600; z-index: 1; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.pos { color: var(--green); } td.neg { color: var(--red); }
    /* Markdown widgets (#1805) */
    .md { padding: 12px 14px; font-size: 13px; }
    .md h1, .md h2, .md h3, .md h4 { margin: 8px 0 6px; line-height: 1.25; }
    .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; } .md h4 { font-size: 13px; }
    .md p { margin: 6px 0; }
    .md ul, .md ol { margin: 6px 0 6px 20px; padding: 0; }
    .md li { margin: 2px 0; }
    .md code { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .md pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; }
    .md pre code { border: 0; padding: 0; background: transparent; }
    .md blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .md a { color: var(--accent); }
    .md table { margin: 6px 0; }
    /* Metric widgets (#1805) */
    .metrics { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 14px; }
    .metric { flex: 1 1 120px; min-width: 120px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .metric .mlabel { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .metric .mvalue { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .metric.pos .mvalue { color: var(--green); } .metric.neg .mvalue { color: var(--red); }
    .mnote { padding: 0 14px 12px; color: var(--muted); font-size: 12px; }
    /* Chart widgets — inline SVG, no CDN (#1805) */
    .chart { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .chart svg { max-width: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); }
    .legend .lg { display: flex; align-items: center; gap: 5px; }
    .legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    /* Chat pane */
    .chat { width: 360px; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--panel); }
    .chat .chead { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .chat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .chat .dot.on { background: var(--green); } .chat .dot.off { background: var(--red); }
    .messages { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 8px 11px; border-radius: 8px; max-width: 92%; white-space: pre-wrap; word-wrap: break-word; }
    .msg.human { align-self: flex-end; background: var(--accent); color: #fff; }
    .msg.ai { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
    .msg.note { align-self: stretch; background: transparent; color: var(--muted); font-size: 12px; text-align: center; }
    .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
    .composer input { flex: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Local Workspace Viewer</h1>
    <select id="app-select" title="Switch app"></select>
    <span class="badge" id="app-badge">loading…</span>
    <span class="badge" title="This viewer is served same-origin and renders /apps.json + /widgets.json">local &middot; offline</span>
    <div class="spacer"></div>
    <button id="refresh-btn" title="Reload all widgets in the active tab">↻ Refresh</button>
  </header>
  <div class="main">
    <div class="dashboard">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"><div class="state">Loading dashboard…</div></div>
    </div>
    <aside class="chat">
      <div class="chead"><span class="dot" id="chat-dot"></span><span id="chat-title">Copilot</span></div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="chat-input" type="text" placeholder="Ask the local Copilot…" disabled />
        <button id="chat-send" disabled>Send</button>
      </div>
    </aside>
  </div>

  <script>
  //--------------------------------------------------------------------------
  // Small helpers. Everything is same-origin, so relative URLs are used
  // throughout (works regardless of host/port/scheme).
  //--------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);

  // Escape any backend-derived string before it enters innerHTML. Widget
  // definitions are ours, but row data and option lists come from data
  // endpoints and must not be able to inject markup/script (DOM-XSS).
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  // Render a SAFE markdown subset to HTML (#1805). Every text run is passed
  // through escapeHtml FIRST, so no backend-supplied raw HTML/script can
  // survive — the markdown transforms only ADD our own trusted tags around
  // already-escaped text. Link hrefs are scheme-allowlisted (http/https/
  // relative/anchor/mailto) so `javascript:`/`data:` payloads degrade to
  // plain text. Block structure is parsed on raw lines (before escaping) so
  // `>` blockquotes and `#` headings aren't hidden behind entities.
  function mdToHtml(md) {
    const text = String(md == null ? "" : md);
    if (!text.trim()) return "";

    // Inline: escape, protect code spans, then apply link/bold/italic.
    const inline = (raw) => {
      let s = escapeHtml(raw);
      const codes = [];
      const links = [];
      s = s.replace(/`([^`]+)`/g, (_m, c) => {
        codes.push(c);
        return "\u0000" + (codes.length - 1) + "\u0000";
      });
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, txt, url) => {
        if (!/^(https?:\/\/|\/|#|mailto:)/i.test(url)) return txt; // unsafe scheme -> plain text
        links.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`);
        return "\u0001" + (links.length - 1) + "\u0001";
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      s = s.replace(/_([^_]+)_/g, "<em>$1</em>");
      s = s.replace(/\u0001(\d+)\u0001/g, (_m, i) => links[+i]);
      s = s.replace(/\u0000(\d+)\u0000/g, (_m, i) => `<code>${codes[+i]}</code>`);
      return s;
    };
    const splitRow = (line) => {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map((c) => c.trim());
    };

    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let para = [];
    const flushPara = () => {
      if (para.length) {
        out.push("<p>" + para.map(inline).join("<br>") + "</p>");
        para = [];
      }
    };
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*```/.test(line)) { // fenced code block
        flushPara();
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }
      if (!line.trim()) { flushPara(); i++; continue; }
      const h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flushPara(); const n = h[1].length; out.push(`<h${n}>` + inline(h[2]) + `</h${n}>`); i++; continue; }
      if (/^>\s?/.test(line)) { // blockquote
        flushPara();
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + buf.map(inline).join("<br>") + "</blockquote>");
        continue;
      }
      if (line.includes("|") && i + 1 < lines.length &&
          lines[i + 1].includes("|") && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) { // pipe table
        flushPara();
        const header = splitRow(line);
        i += 2; // header + separator
        const body = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) { body.push(splitRow(lines[i])); i++; }
        const thead = "<tr>" + header.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr>";
        const tbody = body.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("");
        out.push(`<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`);
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) { // unordered list
        flushPara();
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
        out.push("<ul>" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</ul>");
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) { // ordered list
        flushPara();
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
        out.push("<ol>" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</ol>");
        continue;
      }
      para.push(line);
      i++;
    }
    flushPara();
    return out.join("\n");
  }

  async function fetchJSON(url, opts) {
    const resp = await fetch(url, opts);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);
    return resp.json();
  }

  // Resolve a possibly-dotted dataKey and coerce the payload into an array of
  // row objects. Portfolio widgets return the array directly (dataKey ""), but
  // be defensive about common wrappers so an unexpected shape degrades to a
  // readable state instead of throwing.
  function extractRows(resp, dataKey) {
    let d = resp;
    if (dataKey) {
      for (const k of dataKey.split(".")) {
        d = (d && typeof d === "object") ? d[k] : undefined;
      }
    }
    if (Array.isArray(d)) return d;
    for (const wrap of ["items", "results", "data", "rows"]) {
      if (d && Array.isArray(d[wrap])) return d[wrap];
    }
    if (Array.isArray(resp)) return resp;
    if (d && typeof d === "object") return [d]; // single object -> one row
    return [];
  }

  function fmtCell(value, col) {
    if (value === null || value === undefined) return "";
    const isNum = typeof value === "number";
    let text = value;
    if (col && col.formatterFn === "percent" && isNum) text = value.toFixed(2) + "%";
    else if (isNum) text = Number.isInteger(value) ? value : value.toFixed(2);
    return String(text);
  }

  function cellClass(value, col) {
    const cls = [];
    if (typeof value === "number") cls.push("num");
    if (col && col.renderFn === "greenRed" && typeof value === "number") {
      if (value > 0) cls.push("pos"); else if (value < 0) cls.push("neg");
    }
    return cls.join(" ");
  }

  function renderTable(container, rows, widget) {
    if (!rows.length) { container.innerHTML = '<div class="state">No rows returned.</div>'; return; }
    const defs = widget && widget.data && widget.data.table && widget.data.table.columnsDefs;
    const cols = (defs && defs.length)
      ? defs.map((c) => ({ field: c.field, header: c.headerName || c.field, formatterFn: c.formatterFn, renderFn: c.renderFn }))
      : Object.keys(rows[0]).map((k) => ({ field: k, header: k }));
    const thead = "<tr>" + cols.map((c) => `<th>${escapeHtml(c.header)}</th>`).join("") + "</tr>";
    const body = rows.map((r) =>
      "<tr>" + cols.map((c) => {
        const v = r[c.field];
        return `<td class="${cellClass(v, c)}">${escapeHtml(fmtCell(v, c))}</td>`;
      }).join("") + "</tr>"
    ).join("");
    container.innerHTML = `<table><thead>${thead}</thead><tbody>${body}</tbody></table>`;
  }

  //--------------------------------------------------------------------------
  // Chart / metric widget shaping (#1805). Pure functions (no DOM) so they
  // are unit-testable in isolation (see assets/local_viewer/tests/).
  //--------------------------------------------------------------------------

  // Build a chart model from rows + the widget's data.chart config.
  //  - pie:   explicit {type:"pie",labelColumn,valueColumn}
  //  - line:  no config -> infer x = first non-numeric column, y = numeric cols
  //  - empty: nothing chartable -> caller falls back to a table
  function inferChartModel(rows, chartCfg) {
    if (!Array.isArray(rows) || !rows.length) return { kind: "empty" };
    const cfg = chartCfg || {};
    if (cfg.type === "pie" || (cfg.labelColumn && cfg.valueColumn)) {
      const lc = cfg.labelColumn, vc = cfg.valueColumn;
      const slices = rows
        .map((r) => ({ label: String(r[lc]), value: Number(r[vc]) }))
        .filter((s) => Number.isFinite(s.value));
      if (!slices.length) return { kind: "empty" };
      const total = slices.reduce((a, s) => a + Math.abs(s.value), 0);
      return { kind: "pie", slices, total };
    }
    const keys = Object.keys(rows[0]);
    const numericKeys = keys.filter((k) =>
      rows.every((r) => r[k] === null || r[k] === undefined || typeof r[k] === "number") &&
      rows.some((r) => typeof r[k] === "number"));
    if (!numericKeys.length) return { kind: "empty" };

    // Candlestick shape (#1885): rows carrying open/high/low/close (any case)
    // render as candles on a PRICE-only axis with volume kept separate — never
    // as 5 lines sharing one axis (volume ~1e6 crushes price ~1e2 to a flat
    // line). Also pick an explicit x/index column (date/year/period…) even when
    // it is numeric, so a fiscal-year column is the x-axis, not a plotted line.
    const byLower = {};
    keys.forEach((k) => { byLower[k.toLowerCase()] = k; });
    const hasOHLC = ["open", "high", "low", "close"].every((k) => k in byLower);
    const AXIS_HINT = /^(date|datetime|time|timestamp|year|fiscal_year|fiscalyear|period|quarter|label|name|x|index)$/i;
    let xKey = keys.find((k) => !numericKeys.includes(k));
    if (xKey == null) xKey = keys.find((k) => AXIS_HINT.test(k)) ?? null;
    const xLabels = rows.map((r, idx) => String(xKey != null ? r[xKey] : idx));

    if (hasOHLC) {
      const num = (r, k) => (typeof r[k] === "number" ? r[k] : Number(r[k]));
      const candles = rows.map((r, idx) => ({
        x: idx,
        o: num(r, byLower.open), h: num(r, byLower.high),
        l: num(r, byLower.low), c: num(r, byLower.close),
      })).filter((d) => [d.o, d.h, d.l, d.c].every(Number.isFinite));
      if (candles.length) {
        const volKey = byLower.volume;
        const volume = volKey
          ? rows.map((r, idx) => ({ x: idx, y: typeof r[volKey] === "number" ? r[volKey] : null }))
          : null;
        return { kind: "candle", xKey, candles, volume, xLabels };
      }
    }

    const seriesKeys = numericKeys.filter((k) => k !== xKey);
    if (!seriesKeys.length) return { kind: "empty" };
    const series = seriesKeys.map((k) => ({
      key: k,
      points: rows.map((r, idx) => ({ x: idx, y: typeof r[k] === "number" ? r[k] : null })),
    }));
    return { kind: "line", xKey: xKey != null ? xKey : null, series, xLabels };
  }

  // Render a chart model to an inline-SVG string (no CDN, no canvas). Labels
  // and series keys are escaped; numeric coordinates come from Number().
  function svgForChart(model) {
    if (!model || model.kind === "empty") return "";
    const colors = ["#2f81f7", "#3fb950", "#f85149", "#d29922", "#a371f7", "#39c5cf", "#db61a2", "#e3b341", "#8b949e", "#ff7b72"];
    // Compact large magnitudes so y-axis labels never overflow the left pad
    // (#1887): 1005720 -> "1.01M", 103060 -> "103.1k". Small values keep 2dp.
    const fmtAxis = (v) => {
      if (!Number.isFinite(v)) return "";
      const a = Math.abs(v);
      if (a >= 1e9) return (v / 1e9).toFixed(2) + "B";
      if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
      if (a >= 1e3) return (v / 1e3).toFixed(1) + "k";
      return v.toFixed(2);
    };
    if (model.kind === "pie") {
      const size = 220, cx = size / 2, cy = size / 2, r = size / 2 - 10;
      const total = model.total || 1;
      let a0 = -Math.PI / 2;
      const paths = model.slices.map((s, idx) => {
        const frac = Math.abs(s.value) / total;
        const a1 = a0 + frac * 2 * Math.PI;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const large = frac > 0.5 ? 1 : 0;
        const d = `M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z`;
        a0 = a1;
        return `<path d="${d}" fill="${colors[idx % colors.length]}" stroke="#0d1117" stroke-width="1"><title>${escapeHtml(s.label)}: ${(frac * 100).toFixed(1)}%</title></path>`;
      }).join("");
      const legend = model.slices.map((s, idx) =>
        `<div class="lg"><span class="sw" style="background:${colors[idx % colors.length]}"></span>${escapeHtml(s.label)} <b>${((Math.abs(s.value) / total) * 100).toFixed(1)}%</b></div>`
      ).join("");
      return `<div class="chart"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="pie chart">${paths}</svg><div class="legend">${legend}</div></div>`;
    }
    // candle (#1885) — OHLC candlesticks on a PRICE-only y-axis; volume, if
    // present, is drawn as faint bars in a reserved bottom band on its OWN
    // scale so it never crushes the price series.
    if (model.kind === "candle") {
      const W = 480, Hh = 240, pad = 28, padL = 52;
      const cndls = model.candles || [];
      if (!cndls.length) return "";
      const prices = [];
      cndls.forEach((d) => { prices.push(d.h, d.l); });
      let ymin = Math.min(...prices), ymax = Math.max(...prices);
      if (!(ymax > ymin)) { ymin -= 1; ymax += 1; }
      const n = cndls.length;
      const plotW = W - padL - pad;
      const xAt = (i) => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
      const hasVol = Array.isArray(model.volume) && model.volume.some((p) => p.y != null);
      const volBand = hasVol ? 44 : 0;
      const priceBot = Hh - pad - volBand;
      const yAt = (v) => priceBot - ((v - ymin) / (ymax - ymin)) * (priceBot - pad);
      const cw = Math.max(2, (plotW / Math.max(n, 1)) * 0.6);
      const up = "#3fb950", down = "#f85149";
      const bodies = cndls.map((d) => {
        const x = xAt(d.x), col = d.c >= d.o ? up : down;
        const yH = yAt(d.h), yL = yAt(d.l), yO = yAt(d.o), yC = yAt(d.c);
        const top = Math.min(yO, yC), h = Math.max(1, Math.abs(yC - yO));
        return `<line x1="${x.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yL.toFixed(1)}" stroke="${col}" stroke-width="1"/>`
          + `<rect x="${(x - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;
      }).join("");
      let volSvg = "";
      if (hasVol) {
        const vy = model.volume.map((p) => p.y).filter((v) => v != null);
        const vmax = vy.length ? Math.max(...vy) : 1;
        const vBot = Hh - pad, vTop = Hh - pad - volBand + 6;
        volSvg = model.volume.map((p) => {
          if (p.y == null || vmax <= 0) return "";
          const x = xAt(p.x), h = (p.y / vmax) * (vBot - vTop);
          return `<rect x="${(x - cw / 2).toFixed(1)}" y="${(vBot - h).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" fill="#8b949e" opacity="0.45"/>`;
        }).join("");
      }
      const axis = `<line x1="${padL}" y1="${priceBot}" x2="${W - pad}" y2="${priceBot}" stroke="#30363d"/>`
        + `<line x1="${padL}" y1="${pad}" x2="${padL}" y2="${priceBot}" stroke="#30363d"/>`;
      const yhi = `<text x="${padL - 4}" y="${pad + 4}" text-anchor="end" fill="#8b949e" font-size="10">${fmtAxis(ymax)}</text>`;
      const ylo = `<text x="${padL - 4}" y="${priceBot}" text-anchor="end" fill="#8b949e" font-size="10">${fmtAxis(ymin)}</text>`;
      const legend = `<div class="lg"><span class="sw" style="background:${up}"></span>Up</div>`
        + `<div class="lg"><span class="sw" style="background:${down}"></span>Down</div>`
        + (hasVol ? `<div class="lg"><span class="sw" style="background:#8b949e"></span>Volume</div>` : "");
      return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="candlestick chart">${axis}${volSvg}${bodies}${yhi}${ylo}</svg><div class="legend">${legend}</div></div>`;
    }
    // line
    const W = 480, Hh = 240, pad = 28, padL = 52;
    const allY = [];
    model.series.forEach((s) => s.points.forEach((p) => { if (p.y != null) allY.push(p.y); }));
    if (!allY.length) return "";
    let ymin = Math.min(...allY), ymax = Math.max(...allY);
    if (ymin === ymax) { ymin -= 1; ymax += 1; }
    const n = model.series[0].points.length;
    const plotW = W - padL - pad;
    const xAt = (idx) => padL + (n <= 1 ? plotW / 2 : (idx / (n - 1)) * plotW);
    const yAt = (v) => Hh - pad - ((v - ymin) / (ymax - ymin)) * (Hh - 2 * pad);
    const polylines = model.series.map((s, idx) => {
      const pts = s.points.filter((p) => p.y != null).map((p) => `${xAt(p.x).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(" ");
      return `<polyline fill="none" stroke="${colors[idx % colors.length]}" stroke-width="1.5" points="${pts}"><title>${escapeHtml(s.key)}</title></polyline>`;
    }).join("");
    const axis = `<line x1="${padL}" y1="${Hh - pad}" x2="${W - pad}" y2="${Hh - pad}" stroke="#30363d"/>`
      + `<line x1="${padL}" y1="${pad}" x2="${padL}" y2="${Hh - pad}" stroke="#30363d"/>`;
    const yhi = `<text x="${padL - 4}" y="${pad + 4}" text-anchor="end" fill="#8b949e" font-size="10">${fmtAxis(ymax)}</text>`;
    const ylo = `<text x="${padL - 4}" y="${Hh - pad}" text-anchor="end" fill="#8b949e" font-size="10">${fmtAxis(ymin)}</text>`;
    const legend = model.series.map((s, idx) =>
      `<div class="lg"><span class="sw" style="background:${colors[idx % colors.length]}"></span>${escapeHtml(s.key)}</div>`
    ).join("");
    return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="line chart">${axis}${yhi}${ylo}${polylines}</svg><div class="legend">${legend}</div></div>`;
  }

  // Shape a metric endpoint's dict into cards.
  //  - {value,label,note}                 -> one prominent card
  //  - {vol_annualized,var_95_1d,...,note} -> one card per numeric key
  // Sign coloring: value > 0 -> pos, < 0 -> neg.
  function metricModel(obj) {
    const o = (obj && typeof obj === "object" && !Array.isArray(obj)) ? obj : {};
    const note = (typeof o.note === "string") ? o.note : "";
    const humanize = (k) => k.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    const sign = (v) => (typeof v === "number" ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : "");
    if ("value" in o) {
      return { cards: [{ label: (typeof o.label === "string" ? o.label : ""), value: o.value, cls: sign(o.value) }], note };
    }
    const cards = [];
    for (const [k, v] of Object.entries(o)) {
      if (k === "note" || k === "label") continue;
      if (typeof v === "number") cards.push({ label: humanize(k), value: v, cls: sign(v) });
    }
    return { cards, note };
  }

  function renderMarkdown(container, mdText) {
    const text = (typeof mdText === "string") ? mdText : (mdText == null ? "" : String(mdText));
    if (!text.trim()) { container.innerHTML = '<div class="state">No content returned.</div>'; return; }
    const div = document.createElement("div");
    div.className = "md";
    div.innerHTML = mdToHtml(text); // mdToHtml escapes all backend text before adding trusted tags
    container.innerHTML = "";
    container.appendChild(div);
  }

  function renderMetric(container, obj) {
    const model = metricModel(obj);
    if (!model.cards.length) { container.innerHTML = '<div class="state">No metric value returned.</div>'; return; }
    const fmt = (v) => (typeof v === "number"
      ? (Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/0+$/, "").replace(/\.$/, ""))
      : String(v));
    const cards = model.cards.map((c) =>
      `<div class="metric ${c.cls}"><div class="mlabel">${escapeHtml(c.label)}</div><div class="mvalue">${escapeHtml(fmt(c.value))}</div></div>`
    ).join("");
    const note = model.note ? `<div class="mnote">${escapeHtml(model.note)}</div>` : "";
    container.innerHTML = `<div class="metrics">${cards}</div>${note}`;
  }

  function renderChart(container, rows, widgetDef) {
    const cfg = widgetDef && widgetDef.data && widgetDef.data.chart;
    const model = inferChartModel(rows, cfg);
    if (model.kind === "empty") {
      // Loud fallback: show the raw rows as a table rather than a blank chart.
      if (Array.isArray(rows) && rows.length) { renderTable(container, rows, widgetDef); return; }
      container.innerHTML = '<div class="state">No chartable data returned.</div>';
      return;
    }
    container.innerHTML = svgForChart(model);
  }

  //--------------------------------------------------------------------------
  // Dashboard: /apps.json (tabs) + /widgets.json (defs) -> tables.
  //--------------------------------------------------------------------------
  let APP = null;          // the active app object from /apps.json
  let WIDGETS = {};        // widgetId -> definition from /widgets.json

  function initialParams(widgetDef, layoutState) {
    // Precedence: layout state.params > widget default value > "".
    const out = {};
    const stateParams = (layoutState && layoutState.params) || {};
    for (const p of (widgetDef.params || [])) {
      out[p.paramName] = (p.paramName in stateParams) ? stateParams[p.paramName]
        : (p.value !== undefined && p.value !== null ? p.value : "");
    }
    return out;
  }

  function buildQuery(params) {
    const usp = new URLSearchParams();
    for (const [k, v] of Object.entries(params)) {
      if (v !== "" && v !== null && v !== undefined) usp.append(k, v);
    }
    const s = usp.toString();
    return s ? "?" + s : "";
  }

  async function loadWidgetData(bodyEl, widgetDef, params) {
    bodyEl.innerHTML = '<div class="state">Loading…</div>';
    try {
      const resp = await fetchJSON(widgetDef.endpoint + buildQuery(params));
      const type = widgetDef.type || "table";
      if (type === "markdown") { renderMarkdown(bodyEl, resp); return; }
      if (type === "metric") { renderMetric(bodyEl, resp); return; }
      if (type === "chart") {
        const rows = extractRows(resp, widgetDef.data ? widgetDef.data.dataKey : "");
        renderChart(bodyEl, rows, widgetDef);
        return;
      }
      const rows = extractRows(resp, widgetDef.data ? widgetDef.data.dataKey : "");
      renderTable(bodyEl, rows, widgetDef);
    } catch (e) {
      bodyEl.innerHTML = `<div class="state err">Failed to load: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function populateOptions(selectEl, optionsEndpoint, current) {
    try {
      const opts = await fetchJSON(optionsEndpoint);
      const list = Array.isArray(opts) ? opts : extractRows(opts, "");
      selectEl.innerHTML = '<option value="">(all)</option>' + list.map((o) => {
        const value = (o && typeof o === "object") ? (o.value ?? o.label ?? "") : o;
        const label = (o && typeof o === "object") ? (o.label ?? o.value ?? "") : o;
        const sel = String(value) === String(current) ? " selected" : "";
        return `<option value="${escapeHtml(value)}"${sel}>${escapeHtml(label)}</option>`;
      }).join("");
    } catch (e) {
      // Options endpoint failed — leave the free-text fallback in place.
      selectEl.innerHTML = `<option value="${escapeHtml(current || "")}">${escapeHtml(current || "(unavailable)")}</option>`;
    }
  }

  // Build <option> markup from an inline options array (#1886). Mirrors the
  // endpoint-driven populateOptions() shaping so inline-options params render a
  // real <select> instead of a free-text <input>. Pure + escaped -> unit-tested.
  function inlineOptionsHtml(options, current) {
    if (!Array.isArray(options)) return "";
    return options.map((o) => {
      const value = (o && typeof o === "object") ? (o.value ?? o.label ?? "") : o;
      const label = (o && typeof o === "object") ? (o.label ?? o.value ?? "") : o;
      const sel = String(value) === String(current ?? "") ? " selected" : "";
      return `<option value="${escapeHtml(value)}"${sel}>${escapeHtml(label)}</option>`;
    }).join("");
  }

  function renderWidget(gridEl, layoutItem) {
    const def = WIDGETS[layoutItem.i];
    const card = document.createElement("div");
    card.className = "widget";
    if (!def) {
      card.innerHTML = `<div class="whead"><span class="wname">${escapeHtml(layoutItem.i)}</span></div>`
        + `<div class="state err">Unknown widget id "${escapeHtml(layoutItem.i)}" — not in /widgets.json.</div>`;
      gridEl.appendChild(card);
      return;
    }
    // markdown / metric / chart widgets are dispatched by type in
    // loadWidgetData (#1805); unknown future types fall through to the table
    // renderer, which degrades to a "No rows" / raw-object state.
    const params = initialParams(def, layoutItem.state);
    const head = document.createElement("div");
    head.className = "whead";
    head.innerHTML = `<span class="wname">${escapeHtml(def.name || layoutItem.i)}</span>`;
    const paramsWrap = document.createElement("div");
    paramsWrap.className = "params";

    const body = document.createElement("div");
    body.className = "wbody";

    for (const p of (def.params || [])) {
      if (p.show === false) continue;
      const label = document.createElement("label");
      label.textContent = p.label || p.paramName;
      let control;
      if (p.type === "endpoint" && p.optionsEndpoint) {
        control = document.createElement("select");
        populateOptions(control, p.optionsEndpoint, params[p.paramName]);
      } else if (Array.isArray(p.options) && p.options.length) {
        // Inline options (#1886): render a real <select> dropdown so the
        // declared choices are selectable, not typed by hand into an <input>.
        control = document.createElement("select");
        control.innerHTML = inlineOptionsHtml(p.options, params[p.paramName]);
      } else {
        control = document.createElement("input");
        control.type = (p.type === "date") ? "date" : "text";
        control.value = params[p.paramName] ?? "";
        control.placeholder = p.paramName;
      }
      control.addEventListener("change", () => {
        params[p.paramName] = control.value;
        loadWidgetData(body, def, params);
      });
      label.appendChild(control);
      paramsWrap.appendChild(label);
    }
    head.appendChild(paramsWrap);
    card.appendChild(head);
    card.appendChild(body);
    gridEl.appendChild(card);
    loadWidgetData(body, def, params); // async — each widget loads independently
  }

  function renderTab(tabId) {
    for (const b of document.querySelectorAll("#tabs button")) {
      b.classList.toggle("active", b.dataset.tab === tabId);
    }
    const grid = $("grid");
    grid.innerHTML = "";
    const tab = APP.tabs[tabId];
    if (!tab || !tab.layout || !tab.layout.length) {
      grid.innerHTML = '<div class="state">This tab has no widgets.</div>';
      return;
    }
    const ordered = [...tab.layout].sort((a, b) => (a.y - b.y) || (a.x - b.x));
    for (const item of ordered) renderWidget(grid, item);
  }

  let ACTIVE_TAB = null;
  let APPS = [];           // all apps from /apps.json

  function renderTabs() {
    const tabsEl = $("tabs");
    tabsEl.innerHTML = "";
    const tabIds = Object.keys((APP && APP.tabs) || {});
    tabIds.forEach((tid) => {
      const b = document.createElement("button");
      b.textContent = APP.tabs[tid].name || tid;
      b.dataset.tab = tid;
      b.addEventListener("click", () => { ACTIVE_TAB = tid; renderTab(tid); });
      tabsEl.appendChild(b);
    });
    if (tabIds.length) { ACTIVE_TAB = tabIds[0]; renderTab(ACTIVE_TAB); }
    else { $("grid").innerHTML = '<div class="state">This app has no tabs.</div>'; }
  }

  function selectApp(idx) {
    APP = APPS[idx] || APPS[0] || null;
    const sel = $("app-select");
    if (sel) sel.value = String(idx);
    $("app-badge").textContent = (APP && APP.name) || "app";
    if (!APP) { $("grid").innerHTML = '<div class="state err">No apps in /apps.json.</div>'; return; }
    renderTabs();
  }

  async function initDashboard() {
    try {
      const apps = await fetchJSON("/apps.json");
      APPS = Array.isArray(apps) ? apps : [apps];
      WIDGETS = await fetchJSON("/widgets.json");
    } catch (e) {
      $("grid").innerHTML = `<div class="state err">Could not load dashboard: ${escapeHtml(e.message)}</div>`;
      $("app-badge").textContent = "error";
      return;
    }
    // Multi-app switcher (#1805): list every app served by this backend and
    // let the user switch. Terminal has ~12 tabs; Techtrade is a separate app.
    const sel = $("app-select");
    sel.innerHTML = APPS.map((a, i) =>
      `<option value="${i}">${escapeHtml(a.name || ("App " + (i + 1)))}</option>`
    ).join("");
    sel.style.display = APPS.length > 1 ? "" : "none";
    sel.addEventListener("change", () => selectApp(Number(sel.value)));
    selectApp(0);
  }

  $("refresh-btn").addEventListener("click", () => { if (ACTIVE_TAB) renderTab(ACTIVE_TAB); });

  //--------------------------------------------------------------------------
  // Chat pane: POST /query and stream copilotMessageChunk SSE frames.
  // EventSource can't POST, so we read the response body with fetch + a reader
  // and parse the SSE frames by hand.
  //--------------------------------------------------------------------------
  const HISTORY = []; // {role: "human"|"ai", content}
  let CHAT_READY = false;

  function addBubble(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    $("messages").appendChild(el);
    $("messages").scrollTop = $("messages").scrollHeight;
    return el;
  }

  function parseSSEFrame(frame) {
    let event = "message";
    const dataLines = [];
    for (const line of frame.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
    }
    return { event, data: dataLines.join("\n") };
  }

  async function sendChat() {
    const input = $("chat-input");
    const text = input.value.trim();
    if (!text || !CHAT_READY) return;
    input.value = "";
    addBubble("human", text);
    HISTORY.push({ role: "human", content: text });

    const bubble = addBubble("ai", "");
    let answer = "";
    try {
      const resp = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: HISTORY }),
      });
      if (!resp.ok || !resp.body) throw new Error(`HTTP ${resp.status}`);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let m;
        // Frames are delimited by a blank line. sse_starlette uses CRLF
        // (\r\n\r\n); tolerate LF-only (\n\n) too. Match either boundary.
        while ((m = /\r\n\r\n|\n\n/.exec(buf))) {
          const frame = buf.slice(0, m.index);
          buf = buf.slice(m.index + m[0].length);
          const { event, data } = parseSSEFrame(frame);
          if (event === "copilotMessageChunk" && data) {
            try {
              const delta = JSON.parse(data).delta;
              if (delta) { answer += delta; bubble.textContent = answer; }
            } catch (_) { /* ignore malformed frame */ }
          }
        }
      }
    } catch (e) {
      bubble.className = "msg note";
      bubble.textContent = `Chat failed: ${e.message}`;
    }
    if (answer) HISTORY.push({ role: "ai", content: answer });
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  async function initChat() {
    const dot = $("chat-dot");
    try {
      const agents = await fetchJSON("/agents.json");
      const first = agents && Object.values(agents)[0];
      $("chat-title").textContent = (first && first.name) || "Copilot";
      CHAT_READY = true;
      dot.className = "dot on";
      $("chat-input").disabled = false;
      $("chat-send").disabled = false;
      addBubble("note", "Connected to the local Copilot proxy. Ask about your data.");
    } catch (e) {
      CHAT_READY = false;
      dot.className = "dot off";
      $("chat-title").textContent = "Copilot unavailable";
      addBubble("note", "Copilot backend not available on this server (GET /agents.json failed). "
        + "Run/merge the copilot backend (PR #1795, issue #1794) to enable chat.");
    }
  }

  $("chat-send").addEventListener("click", sendChat);
  $("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

  // Boot.
  initDashboard();
  initChat();
  </script>
</body>
</html>
