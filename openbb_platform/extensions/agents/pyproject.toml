[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit-core>=3.8,<4"]

[project]
name = "openbb-agents"
version = "0.1.0"
description = "Google ADK agents extension for OpenBB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ADK from local fork — install with: pip install -e I:/masterswork/git/adk-python
    # Listed here as a soft reference; install separately before this package
    "litellm>=1.40",
    "mcp>=1.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
openbb-agents-mcp = "openbb_agents.mcp_server:main"

[tool.flit.module]
name = "openbb_agents"
