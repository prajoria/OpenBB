[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit-core>=3.8,<4"]

[project]
name = "openbb-agents"
version = "0.1.0"
description = "Google ADK agents extension for OpenBB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ADK from the prajoria/adk-python fork, vendored as a git submodule at
    # third_party/adk-python. Install separately before this package:
    #   git submodule update --init third_party/adk-python
    #   pip install -e third_party/adk-python
    # (see README for the non-submodule git+https alternative)
    "litellm>=1.40",
    "mcp>=1.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
openbb-agents-mcp = "openbb_agents.mcp_server:main"

[tool.flit.module]
name = "openbb_agents"
