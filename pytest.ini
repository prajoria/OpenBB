[pytest]
# --import-mode=importlib avoids test-module basename collisions across
# extensions (see #739). Without it, two tests/unit/test_helpers.py in
# different packages collide because pytest synthesizes module names
# from the rootdir-relative path.
addopts = -p no:warnings --import-mode=importlib
# Exclude vendored third-party test trees from pytest collection.
# `external/pandas-ta-classic/tests/` ships as part of the vendored
# pandas-ta-classic library — its tests belong to it and depend on
# `hypothesis` and other dev-only deps we don't install here. Collection
# was scanning them and failing on ~29 ImportError entries, blocking
# the `Unit test Platform` CI job on every PR. See PR restoring CI.
norecursedirs = .git .venv .venv_win .venv_win.backup-* external node_modules build dist *.egg-info __pycache__
markers =
    linux: tests that are not stable on Windows
    integration: OpenBB Platform integration test marker
testpaths =
    tests
    openbb_platform/**/tests
