[pytest]
# --import-mode=importlib avoids test-module basename collisions across
# extensions (see #739). Without it, two tests/unit/test_helpers.py in
# different packages collide because pytest synthesizes module names
# from the rootdir-relative path.
addopts = -p no:warnings --import-mode=importlib
markers =
    linux: tests that are not stable on Windows
    integration: OpenBB Platform integration test marker
testpaths =
    tests
    openbb_platform/**/tests
